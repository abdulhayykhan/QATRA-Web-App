name: QATRA CI Pipeline

# Owner: Nimra Iftikhar (NFR / CI lead)
# Runs automated linting and pytest suite on all pull requests and pushes to main & develop.

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  lint:
    name: Code Quality & Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint Check
        run: |
          ruff check backend/app

  test:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest
    needs: lint
    env:
      ENVIRONMENT: test
      DEBUG: "False"
      SECRET_KEY: "a9ba8ddb3a72899a15a3ccf66992c5f8313400a9743281f2374d939d5c194f5f"
      ENCRYPTION_KEY_AES256: "c75a7b8cf0cb0653fc66e54800ee0194b02d1dcd0262d970f695f4e87e20f775"
      DATABASE_URL: "sqlite:///:memory:"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock

      - name: Run Backend Pytest Suite
        run: |
          pytest backend/tests -v
