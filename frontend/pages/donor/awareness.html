<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QATRA — Awareness Library & Drives</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <style>
    .category-pills {
      display: flex;
      gap: var(--space-xs);
      overflow-x: auto;
      padding-bottom: var(--space-sm);
      margin-bottom: var(--space-md);
      scrollbar-width: none;
    }
    .category-pills::-webkit-scrollbar {
      display: none;
    }
    .cat-pill {
      padding: 6px 14px;
      border-radius: var(--radius-full);
      background: var(--bg-surface);
      border: 1px solid var(--border-color-strong);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .cat-pill.active {
      background: var(--primary-red);
      color: #fff;
      border-color: var(--primary-red);
    }
    .myth-fact-card {
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: var(--space-md);
      background: var(--bg-surface);
      box-shadow: var(--shadow-sm);
    }
    .myth-box {
      background: var(--primary-red-subtle);
      border-left: 4px solid var(--primary-red);
      padding: 12px 16px;
      font-size: 14px;
    }
    .fact-box {
      background: var(--color-success-light);
      border-left: 4px solid var(--color-success);
      padding: 12px 16px;
      font-size: 14px;
    }
    .event-card {
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--space-md);
      margin-bottom: var(--space-md);
      background: var(--bg-surface);
      box-shadow: var(--shadow-sm);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div style="display: flex; align-items: center; gap: var(--space-sm);">
        <a href="/index.html" style="text-decoration: none; font-size: 18px;">←</a>
        <span style="font-weight: 700; font-size: 16px;">Awareness & Drives</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-content">
      <!-- Category Tabs -->
      <div class="category-pills" id="category-pills">
        <div class="cat-pill active" data-cat="">All Content</div>
        <div class="cat-pill" data-cat="myths_facts">💡 Myths vs Facts</div>
        <div class="cat-pill" data-cat="basics">🩸 Donation 101</div>
        <div class="cat-pill" data-cat="health_prep">🥗 Prep & Diet</div>
        <div class="cat-pill" data-cat="events">🎪 Campus Drives</div>
      </div>

      <!-- Feed Container -->
      <div id="awareness-container">
        <div style="text-align: center; padding: 40px; color: var(--text-muted);">
          Loading educational resources...
        </div>
      </div>
    </main>

    <!-- Event Registration Modal -->
    <div id="register-modal" class="modal-overlay">
      <div class="modal-content">
        <button class="modal-close" id="modal-close-btn">✕</button>
        <h3 id="modal-event-title" style="margin-bottom: 4px;">Campus Blood Drive</h3>
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: var(--space-md);">
          Register your slot for on-site donation. We will send you an in-app and email reminder.
        </p>

        <form id="event-reg-form">
          <div class="form-group">
            <label class="form-label" for="reg-name">Your Full Name *</label>
            <input type="text" id="reg-name" class="form-input" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-blood">Blood Group *</label>
            <select id="reg-blood" class="form-select">
              <option value="O+">O+</option>
              <option value="O-">O-</option>
              <option value="A+">A+</option>
              <option value="B+">B+</option>
              <option value="AB+">AB+</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-role">Participating As</label>
            <select id="reg-role" class="form-select">
              <option value="donor">Blood Donor</option>
              <option value="volunteer">Event Volunteer / Desk Support</option>
            </select>
          </div>

          <button type="submit" id="confirm-reg-btn" class="btn btn-primary" style="margin-top: var(--space-sm);">
            Confirm Registration 🎟️
          </button>
        </form>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="/index.html">
        <span class="nav-icon">🏠</span>
        <span>Home</span>
      </a>
      <a href="/seeker/feed.html">
        <span class="nav-icon">📢</span>
        <span>Feed</span>
      </a>
      <a href="/seeker/map.html">
        <span class="nav-icon">🗺️</span>
        <span>Map</span>
      </a>
      <a href="/donor/dashboard.html">
        <span class="nav-icon">👤</span>
        <span>Donor</span>
      </a>
    </nav>
  </div>

  <script type="module" src="/static/js/awareness.js"></script>
</body>
</html>
