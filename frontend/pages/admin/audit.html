<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QATRA — Security & Compliance Audit Trail</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <style>
    .audit-table-wrapper {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow-x: auto;
      box-shadow: var(--shadow-sm);
    }
    table.audit-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }
    table.audit-table th {
      background: var(--bg-canvas);
      padding: 12px 14px;
      font-weight: 700;
      color: var(--text-main);
      border-bottom: 2px solid var(--border-color);
      white-space: nowrap;
    }
    table.audit-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }
    table.audit-table tr:hover {
      background: var(--bg-subtle);
    }
  </style>
</head>
<body>
  <div class="app-container wide-view">
    <!-- Header -->
    <header class="app-header">
      <div style="display: flex; align-items: center; gap: var(--space-sm);">
        <a href="/admin/verification.html" style="text-decoration: none; font-size: 18px;">←</a>
        <span style="font-weight: 700; font-size: 16px;">Security & Compliance Audit Trail (NFR 2.5)</span>
      </div>
      <button id="refresh-audit-btn" class="btn btn-sm btn-secondary" style="width: auto;">🔄 Refresh</button>
    </header>

    <!-- Main Content -->
    <main class="app-content">
      <div style="margin-bottom: var(--space-md); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--space-sm);">
        <div>
          <h2>Tamper-Evident Access Logs</h2>
          <p style="font-size: 13px; margin-bottom: 0;">Logs all CNIC, hospital slip, and biometric/health screening access events.</p>
        </div>
        <div>
          <span class="badge badge-success">AES-256 Vault Protected 🔒</span>
        </div>
      </div>

      <div class="audit-table-wrapper">
        <table class="audit-table">
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Action</th>
              <th>Resource</th>
              <th>Target ID</th>
              <th>User ID</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody id="audit-table-body">
            <tr>
              <td colspan="6" style="text-align: center; padding: 30px; color: var(--text-muted);">
                Fetching audit compliance records...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module" src="/static/js/admin-audit.js"></script>
</body>
</html>
