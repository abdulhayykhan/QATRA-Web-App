<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QATRA - All-Karachi Live Map Engine</title>
    <link rel="stylesheet" href="https://unpkg.com" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header class="map-header">
            <button class="back-btn">&#8592;</button>
            <h1>Live Map</h1>
            <div class="notification-badge"></div>
        </header>

        <div class="hospital-search-box">
            <input type="text" id="hospital-input" placeholder="🔍 Search hospital, area or town in Karachi..." oninput="filterHospitalSuggestions()">
            <div id="suggestions-list" class="suggestions-dropdown hidden-element"></div>
        </div>

        <div id="live-map"></div>

        <div id="request-card" class="summary-card hidden-element">
            <div class="card-handle"></div>
            <div class="card-main-info">
                <div class="blood-badge" id="card-blood">O-</div>
                <div class="details">
                    <h3 id="hospital-name">City Hospital</h3>
                    <p id="card-urgency" class="urgency-tag high-urgency">Needed within 2 Hours</p>
                </div>
            </div>
            <div class="metrics-grid">
                <div class="metric"><span class="icon">📍</span> <span id="geo-distance">0.0 km</span> away</div>
                <div class="metric"><span class="icon">⏱️</span> ETA: <span id="geo-eta">0 mins</span></div>
                <div class="metric"><span class="icon">👥</span> <span id="donor-count">0</span> Donors</div>
            </div>
            <button id="accept-dispatch-btn" class="primary-action-btn">Accept Dispatch</button>
        </div>
    </div>

    <script src="https://unpkg.com" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="app.js"></script>
</body>
</html>
